name: Keep Render Alive 24/7

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping (inactivity limit is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ClayMelo Website
        run: |
          curl -s -f --max-time 60 https://claymelo-shop.onrender.com/api/health || echo "Ping attempted"
